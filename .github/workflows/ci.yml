name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server-test:
    runs-on: ubuntu-latest
    # The original workflow had no timeout and hung for GitHub's full 6-hour
    # job limit when the test run never exited. Fail fast instead.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      # `npm ci` installs the committed lockfile reproducibly; `npm install`
      # silently resolved a fresh dependency tree on every run.
      - name: Install dependencies
        run: npm ci
      - name: Run server tests
        working-directory: server
        timeout-minutes: 5
        run: npm test

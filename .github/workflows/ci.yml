name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run server tests
        working-directory: server
        run: |
          npm install
          npm test
